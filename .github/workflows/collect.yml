name: Hourly collector

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC (off-peak; GitHub may still delay or skip runs)
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Sensor window in hours (blank = default from config/area.json)"
        required: false
        default: ""
      discover:
        description: "Force station rediscovery"
        type: boolean
        default: false
      reblend_from:
        description: "Re-blend every hour from this UTC time (e.g. 2026-11-09T11), even if unchanged (blank = normal run)"
        required: false
        default: ""

permissions:
  contents: write   # commit sensor files and create GOES-19 release assets

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Collect (20 min) + clean and blend (15 min) + commit, with room to spare.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect
        id: collect
        continue-on-error: true
        # Its own limit, well under the job's 30 minutes, so a slow source cannot stop the commit step.
        # GOES-19 runs first and saves its index after each day, so its work survives a timeout.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}   # optional; leave unset if you have none
        run: |
          args=()
          if [ -n "${{ inputs.lookback_hours }}" ]; then args+=(--lookback-hours "${{ inputs.lookback_hours }}"); fi
          if [ "${{ inputs.discover }}" = "true" ]; then args+=(--discover); fi
          python -m collector.run "${args[@]}"

      # Clean and blend run after collection and before the commit, in their own step with their
      # own time limit, so a blend failure or timeout never stops the raw data from being saved.
      - name: Restore water-path cache
        id: wp_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/cache/graph
            build/cache/distance
          key: water-paths-${{ hashFiles('data/grid/grid.json', 'processing/waterpaths.py') }}-none
          restore-keys: water-paths-${{ hashFiles('data/grid/grid.json', 'processing/waterpaths.py') }}-

      - name: Clean and blend
        id: blend
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--max-minutes 12)
          if [ -n "${{ inputs.reblend_from }}" ]; then args+=(--start "${{ inputs.reblend_from }}" --force); fi
          python -m processing.run "${args[@]}"

      - name: Water-path cache key
        id: wp_key
        if: always()
        continue-on-error: true
        run: |
          list=$(ls build/cache/distance/*/ 2>/dev/null | sort | sha1sum | cut -c1-12)
          echo "key=water-paths-${{ hashFiles('data/grid/grid.json', 'processing/waterpaths.py') }}-${list}" >> "$GITHUB_OUTPUT"

      - name: Save water-path cache
        if: always() && steps.wp_key.outputs.key != '' && steps.wp_key.outputs.key != steps.wp_cache.outputs.cache-matched-key
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/cache/graph
            build/cache/distance
          key: ${{ steps.wp_key.outputs.key }}

      - name: Commit results
        run: |
          git config user.name "swfl-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data STATIONS.md
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -q -m "Collector run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((i * 10))
            git pull --rebase -q
          done
          echo "Push failed after retries" >&2
          exit 1

      - name: Report collector failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "The collector reported a failure. See data/status/last_run.json for details." >&2
          exit 1

      - name: Report blend failure
        if: steps.blend.outcome == 'failure'
        run: |
          echo "The clean and blend step failed or timed out. Raw data was still committed. See data/status/last_blend.json." >&2
          exit 1
