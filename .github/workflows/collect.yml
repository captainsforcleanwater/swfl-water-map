name: Hourly collector

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC (off-peak; GitHub may still delay or skip runs)
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Sensor window in hours (blank = default from config/area.json)"
        required: false
        default: ""
      discover:
        description: "Force station rediscovery"
        type: boolean
        default: false

permissions:
  contents: write   # commit sensor files and create GOES-19 release assets

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}   # optional; leave unset if you have none
        run: |
          args=()
          if [ -n "${{ inputs.lookback_hours }}" ]; then args+=(--lookback-hours "${{ inputs.lookback_hours }}"); fi
          if [ "${{ inputs.discover }}" = "true" ]; then args+=(--discover); fi
          python -m collector.run "${args[@]}"

      - name: Commit results
        run: |
          git config user.name "swfl-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data STATIONS.md
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -q -m "Collector run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((i * 10))
            git pull --rebase -q
          done
          echo "Push failed after retries" >&2
          exit 1

      - name: Report collector failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "The collector reported a failure. See data/status/last_run.json for details." >&2
          exit 1
